name: release

# タグ v* を push すると，検証（typecheck・smoke）を通したうえでインストーラを
# ビルドし，GitHub Releases の下書きに添付する．
# 例) git tag -a v0.1.1 -m "..." && git push origin v0.1.1
# 手動実行 (workflow_dispatch) は既存タグ名の入力が必須（main 等の誤タグを防ぐ）．
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (e.g. v0.1.1)'
        required: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        run: |
          echo "tag=$RELEASE_TAG"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::not a version tag: $RELEASE_TAG"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install, build, type-check, smoke test
        run: |
          npm ci
          npm run build:libs
          npm run typecheck
          npm run smoke

  release:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: Apple Silicon + Intel を 1 つの universal .dmg に
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Linux: .AppImage / .deb / .rpm
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          # Windows: .msi / .exe (NSIS)
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './packages/desktop-app/src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install JS dependencies
        run: npm ci

      - name: Build shared libraries (@rps/core, renderer, exporter)
        run: npm run build:libs

      - name: Build app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop-app
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Research Poster Studio ${{ env.RELEASE_TAG }}'
          releaseBody: |
            各 OS のインストーラを添付しています / Installers for each OS are attached below.

            - Windows: `.msi` / `.exe`
            - macOS (universal): `.dmg`
            - Linux: `.AppImage` / `.deb` / `.rpm`

            注: アプリは未署名のため，初回起動時に OS の警告が出ることがあります
            （Windows SmartScreen / macOS Gatekeeper）．回避手順は README を参照してください．
            ライセンスは Apache License 2.0 です．
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
