name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (shared libraries + CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared libraries
        run: npm run build:libs

      - name: Type-check (all workspaces)
        run: npm run typecheck

      - name: Smoke tests (column layout + CLI)
        run: npm run smoke

  export-pdf:
    name: PDF export (headline output)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared libraries
        run: npm run build:libs

      - name: Install Chromium (for PDF/PNG export)
        run: npx playwright install --with-deps chromium

      - name: Validate demo posters (schema + rendered overflow)
        run: |
          npm run rps -- validate examples/sample-cat-paws-en
          npm run rps -- validate examples/sample-cat-paws-ja

      - name: Validate the `rps init` templates (rendered overflow)
        run: |
          for t in quantitative qualitative multi-study; do
            npm run rps -- init "$RUNNER_TEMP/tpl-$t" --template "$t"
            npm run rps -- validate "$RUNNER_TEMP/tpl-$t"
          done

      - name: Export sample poster to PDF
        run: npm run rps -- export pdf examples/sample-cat-paws-en

      - name: Check the PDF was produced
        run: test -s examples/sample-cat-paws-en/exports/poster.pdf
