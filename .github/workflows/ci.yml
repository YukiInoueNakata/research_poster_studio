name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (shared libraries + CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared libraries
        run: npm run build:libs

      - name: Type-check (all workspaces)
        run: npm run typecheck

      - name: Smoke tests (column layout + CLI)
        run: npm run smoke

  export-pdf:
    name: PDF export (headline output)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared libraries
        run: npm run build:libs

      - name: Install Chromium (for PDF/PNG export)
        run: npx playwright install --with-deps chromium

      - name: Export sample poster to PDF
        run: npm run rps -- export pdf examples/sample-full

      - name: Check the PDF was produced
        run: test -s examples/sample-full/exports/poster.pdf
